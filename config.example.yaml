# Example configuration for abus_rtsp_bridge.py (--config config.example.yaml or
# ABUS_CONFIG_FILE=/path/to/this/file). Cameras are listed under `cameras` (at least one); the
# other sections are shared by all of them. See src/config_file.py's module docstring for the
# authoritative schema.
#
# A Home Assistant add-on's own /data/options.json also works as-is here (JSON is valid YAML).

cameras:
  - name: front_door               # unique; letters, digits, _ and -; the stream is rtsp://<host>:8554/front_door
    did: ABCD-012345-EFGHI         # did and/or target_ip is required when there are several cameras
    password: changeme
    # target_ip: 192.168.1.64
    # bind_ip: 192.168.1.10
    # timeout: 5.0                 # discovery seconds
    onvif_port: 8000               # enables ONVIF for this camera on its own port (must be unique)
    # onvif_ws_discovery: true     # optional, with onvif_port
    # onvif_ptz_step: 2            # optional, with onvif_port
    # resolution / disable_audio / disable_talkback: override the rtsp section for this camera
  - name: garage
    did: WXYZ-987654-ABCDE
    password: garage-password

rtsp:
  bind_ip: 0.0.0.0              # listen address
  port: 8554                    # shared by all cameras, told apart by path
  resolution: 0
  disable_audio: false
  disable_talkback: false       # two-way audio via the ONVIF RTSP backchannel

ptz:
  enabled: true
  http_host: 0.0.0.0
  http_port: 8080

auth:
  username: null
  password: null

diagnostics:
  debug: false
  dump_raw: null
  skip_video_start: false
  skip_audio_start: false

