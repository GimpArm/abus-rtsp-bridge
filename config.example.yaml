# Example structured YAML configuration for abus_rtsp_bridge.py (--config config.example.yaml
# or ABUS_CONFIG_FILE=/path/to/this/file). Every section/key here is optional - anything you
# omit keeps its normal command-line default. See src/config_file.py's module docstring for
# the authoritative schema.
#
# A Home Assistant add-on's own /data/options.json also works as-is here (JSON is valid YAML).

camera:
  did: ABCD-012345-EFGHI
  password: changeme
  bind_ip: 192.168.1.10
  target_ip: 192.168.1.64
  timeout: 5.0

rtsp:
  url: rtsp://0.0.0.0:8554/abus
  resolution: 0
  disable_audio: false

ptz:
  enabled: true
  http_host: 0.0.0.0
  http_port: 8080

onvif:
  enabled: true
  ws_discovery: true
  port: 8000
  ptz_step: 2

auth:
  username: null
  password: null

diagnostics:
  debug: false
  dump_raw: null
  skip_video_start: false
  skip_audio_start: false
